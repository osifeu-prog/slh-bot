name: SLH Mission Execution Boundary

on:
  pull_request:
    paths:
      - 'core/mission_lifecycle.py'
      - 'core/mission_orchestrator.py'
      - 'agents/mission_executor.py'
      - 'tests/test_mission_execution_contract.py'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  mission-execution-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run mission execution contract tests
        run: python3 -m pytest -q tests/test_mission_execution_contract.py
