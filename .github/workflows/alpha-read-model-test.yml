name: Alpha Read Model Test

on:
  pull_request:
    paths:
      - "core/investor_read_model.py"
      - "tests/test_investor_read_model.py"
      - ".github/workflows/alpha-read-model-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run investor read-model tests
        run: python -m unittest tests/test_investor_read_model.py -v
