name: SLH Wallet Binding Boundary

on:
  pull_request:
    paths:
      - 'core/wallet_binding.py'
      - 'core/ton_wallet_binding.py'
      - 'core/ton_deposit_service.py'
      - 'tests/test_wallet_binding.py'
      - 'tests/test_ton_wallet_binding.py'
      - 'tests/test_ton_deposit_service.py'
      - 'tests/test_secure_wallet_binding_contract.py'
      - 'tests/test_wallet_and_academy_ui_contract.py'
      - 'webapp.py'
      - 'mini_app.html'
      - 'handlers/ton_address_handler.py'
      - 'handlers/wallet_handler.py'
      - 'ton_handler.py'
      - 'requirements.txt'
      - '.github/workflows/wallet-binding.yml'

jobs:
  wallet-binding:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture CI diagnostics
        run: bash tools/ci_diagnostics.sh
      - run: pip install -r requirements.txt
      - name: Run wallet binding tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest tests/test_wallet_binding.py tests/test_ton_wallet_binding.py tests/test_ton_deposit_service.py tests/test_secure_wallet_binding_contract.py tests/test_wallet_and_academy_ui_contract.py 2>&1 | tee ci-diagnostics/wallet-binding-tests.log
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slh-wallet-binding-diagnostics
          path: ci-diagnostics/**
          if-no-files-found: warn
