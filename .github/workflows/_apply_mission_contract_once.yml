name: Apply Mission Contract Patch

on:
  push:
    branches:
      - feat/mission-real-execution-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply mission execution contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal contract changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          lifecycle = Path('core/mission_lifecycle.py')
          text = lifecycle.read_text(encoding='utf-8')

          pattern = re.compile(r'    def execute_mission\(\n.*?\n\n    def complete_mission\(', re.S)
          replacement = '''    def execute_mission(\n        self,\n        mission_id,\n        execution_result=None\n    ):\n\n        from datetime import datetime, timezone\n        from pathlib import Path\n        import json\n        import shutil\n        import hashlib\n\n        from core.mission_lock import (\n            MissionLifecycleLock\n        )\n\n        with MissionLifecycleLock(\n            self.root\n        ):\n\n            board, manifest = (\n                self.load_state()\n            )\n\n            mission = self.find_mission(\n                board,\n                mission_id\n            )\n\n            if mission is None:\n                return {\n                    "status": "blocked",\n                    "reason": "mission_not_found",\n                    "mission_id": str(mission_id),\n                    "write_performed": False,\n                }\n\n            current_status = mission.get("status")\n\n            if current_status in ("executed", "completed"):\n                return {\n                    "status": "blocked",\n                    "reason": "mission_already_executed",\n                    "mission_id": str(mission_id),\n                    "current_status": current_status,\n                    "write_performed": False,\n                    "read_only": True,\n                }\n\n            agent_id = mission.get("assigned_to")\n            agent = self.find_agent(manifest, agent_id)\n\n            checks = {\n                "mission_exists": mission is not None,\n                "agent_exists": agent is not None,\n                "mission_status_assigned": mission.get("status") == "assigned",\n                "assignment_matches": (\n                    agent is not None\n                    and str(mission.get("assigned_to")) == str(agent.get("id"))\n                ),\n                "agent_state_eligible": (\n                    agent is not None\n                    and agent.get("state") in ("idle", "active")\n                ),\n            }\n\n            if not all(checks.values()):\n                return {\n                    "status": "blocked",\n                    "mission_id": str(mission_id),\n                    "agent_id": str(agent_id),\n                    "checks": checks,\n                    "write_performed": False,\n                }\n\n            if not isinstance(execution_result, dict):\n                return {\n                    "status": "blocked",\n                    "reason": "execution_result_required",\n                    "mission_id": str(mission_id),\n                    "agent_id": str(agent_id),\n                    "write_performed": False,\n                    "read_only": True,\n                }\n\n            if execution_result.get("execution_status") != "success":\n                return {\n                    "status": "blocked",\n                    "reason": "execution_not_successful",\n                    "mission_id": str(mission_id),\n                    "agent_id": str(agent_id),\n                    "write_performed": False,\n                    "read_only": True,\n                }\n\n            if execution_result.get("verified") is not True:\n                return {\n                    "status": "blocked",\n                    "reason": "execution_not_verified",\n                    "mission_id": str(mission_id),\n                    "agent_id": str(agent_id),\n                    "write_performed": False,\n                    "read_only": True,\n                }\n\n            if not execution_result.get("evidence"):\n                return {\n                    "status": "blocked",\n                    "reason": "execution_evidence_required",\n                    "mission_id": str(mission_id),\n                    "agent_id": str(agent_id),\n                    "write_performed": False,\n                    "read_only": True,\n                }\n\n            now = datetime.now(timezone.utc)\n            timestamp = now.strftime("%Y%m%dT%H%M%SZ")\n            root = Path(self.root)\n            board_path = root / "state" / "missions" / "board.json"\n            results_dir = root / "state" / "missions" / "results"\n            backup_dir = root / "state" / "takeover" / "backups"\n            results_dir.mkdir(parents=True, exist_ok=True)\n            backup_dir.mkdir(parents=True, exist_ok=True)\n\n            backup_path = backup_dir / f"board_before_api_execution_{timestamp}.json"\n            shutil.copy2(board_path, backup_path)\n\n            execution_started_at = now.isoformat()\n            execution_completed_at = datetime.now(timezone.utc).isoformat()\n            mission["status"] = "executed"\n            mission["execution_started_at"] = execution_started_at\n            mission["execution_completed_at"] = execution_completed_at\n\n            result_id = f"mission-{mission_id}-{timestamp}"\n            result = dict(execution_result)\n            result["result_id"] = result_id\n            result["mission_id"] = str(mission_id)\n            result["agent_id"] = str(agent_id)\n            result.setdefault("mission_completion", "pending")\n            result["recorded_at"] = execution_completed_at\n\n            canonical = json.dumps(result, sort_keys=True, ensure_ascii=False)\n            result["result_sha256"] = hashlib.sha256(canonical.encode("utf-8")).hexdigest()\n\n            result_path = results_dir / f"{result_id}.json"\n            self._atomic_write_text(\n                result_path,\n                json.dumps(result, indent=2, ensure_ascii=False)\n            )\n            self._atomic_write_text(\n                board_path,\n                json.dumps(board, indent=2, ensure_ascii=False)\n            )\n\n            return {\n                "status": "executed",\n                "mission_id": str(mission_id),\n                "agent_id": str(agent_id),\n                "execution_status": "success",\n                "result_id": result_id,\n                "result_path": str(result_path),\n                "backup": str(backup_path),\n                "write_performed": True,\n                "read_only": False,\n            }\n\n\n    def complete_mission('''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('expected exactly one execute_mission block')
          lifecycle.write_text(updated, encoding='utf-8')

          orchestrator = Path('core/mission_orchestrator.py')
          text = orchestrator.read_text(encoding='utf-8')
          pattern = re.compile(r'        if action == "execute":\n.*?\n        if action == "assign":', re.S)
          replacement = '''        if action == "execute":\n\n            preview = (\n                self.lifecycle\n                .preview_execution(\n                    mission_id=mission_id\n                )\n            )\n\n            if preview.get("status") != "ready":\n                return {\n                    "status": "blocked",\n                    "action": "execute",\n                    "preview": preview,\n                }\n\n            # The execution boundary is explicit: the adapter cannot\n            # manufacture success. A real runtime result must be supplied\n            # before lifecycle state may be committed.\n            from agents.mission_executor import MissionExecutorAgent\n\n            execution_result = (\n                MissionExecutorAgent().process({\n                    "cmd": "Mission Executor:execute_mission",\n                    "mission_id": str(mission_id),\n                    "source": "mission_orchestrator",\n                })\n            )\n\n            if execution_result.get("execution_status") == "blocked":\n                return {\n                    "status": "blocked",\n                    "action": "execute",\n                    "result": execution_result,\n                }\n\n            result = (\n                self.lifecycle\n                .execute_mission(\n                    mission_id=mission_id,\n                    execution_result=execution_result,\n                )\n            )\n\n            if result.get("status") != "executed":\n                return {\n                    "status": "blocked",\n                    "action": "execute",\n                    "result": result,\n                }\n\n            return {\n                "status": "executed",\n                "action": "execute",\n                "result": result,\n            }\n\n        if action == "assign":'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('expected exactly one orchestrator execute block')
          orchestrator.write_text(updated, encoding='utf-8')
          PY

      - name: Verify syntax
        run: |
          python -m py_compile core/mission_lifecycle.py core/mission_orchestrator.py agents/mission_executor.py

      - name: Commit generated changes and remove one-time patcher
        run: |
          rm -f .github/workflows/_apply_mission_contract_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/mission_lifecycle.py core/mission_orchestrator.py
          git add -u .github/workflows/_apply_mission_contract_once.yml
          git commit -m "chore: apply mission execution contract"
          git push origin HEAD:feat/mission-real-execution-contract
