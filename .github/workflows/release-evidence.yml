name: Release Evidence Correlation

on:
  workflow_run:
    workflows:
      - SLH CI
      - SLH Full Regression
      - Bot Vault Regression
      - Validate and hand off to Railway
    types: [completed]
    branches: [main]

concurrency:
  group: release-evidence-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  statuses: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    steps:
      - name: Correlate completed workflow evidence by SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          gh run list --repo "$REPO" --commit "$SHA" --limit 100             --json name,status,conclusion,databaseId,headSha > runs.json

          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          runs = json.loads(Path("runs.json").read_text(encoding="utf-8"))

          required_names = [
              "SLH CI",
              "SLH Full Regression",
              "Bot Vault Regression",
              "Validate and hand off to Railway",
          ]

          required = {}
          for name in required_names:
              candidates = [
                  run for run in runs
                  if run.get("name") == name and run.get("headSha") == sha
              ]
              if candidates:
                  required[name] = max(
                      candidates,
                      key=lambda item: int(item.get("databaseId") or 0),
                  )

          def conclusion(name):
              run = required.get(name)
              if not run:
                  return "MISSING"
              return str(
                  run.get("conclusion") or run.get("status") or "UNKNOWN"
              ).upper()

          def railway_state():
              payload = json.loads(
                  subprocess.check_output(
                      [
                          "gh",
                          "api",
                          f"repos/{repo}/commits/{sha}/statuses",
                          "--paginate",
                      ],
                      text=True,
                  )
              )
              matches = [
                  item
                  for item in payload
                  if item.get("context") == "slh-cloud-bot - slh-cloud-bot"
              ]
              if not matches:
                  return None
              latest = max(
                  matches,
                  key=lambda item: str(item.get("created_at") or ""),
              )
              return str(latest.get("state") or "").lower() or None

          ci_ok = conclusion("SLH CI") == "SUCCESS"
          tests_ok = conclusion("SLH Full Regression") == "SUCCESS"
          security_ok = conclusion("Bot Vault Regression") == "SUCCESS"
          handoff_ok = conclusion("Validate and hand off to Railway") == "SUCCESS"

          required_failed = any(
              conclusion(name) in {"FAILURE", "CANCELLED", "TIMED_OUT", "ERROR"}
              for name in required_names
          )
          required_pending = any(
              conclusion(name) in {"MISSING", "QUEUED", "IN_PROGRESS"}
              for name in required_names
          )

          railway = railway_state()
          for attempt in range(18):
              if railway == "success":
                  break
              if railway in {"failure", "error"}:
                  break
              if required_failed or required_pending or not handoff_ok:
                  break
              time.sleep(5)
              railway = railway_state()

          if required_failed:
              aggregate = "FAIL"
          elif required_pending:
              aggregate = "PENDING"
          elif all((ci_ok, tests_ok, security_ok, handoff_ok)):
              aggregate = "PASS"
          else:
              aggregate = "PENDING"

          if railway == "success":
              deployment_status = "SUCCESS"
              deployment_source = "external_verified"
          elif railway in {"failure", "error"}:
              deployment_status = "FAIL"
              deployment_source = "external_verified"
          else:
              deployment_status = "PENDING"
              deployment_source = "github_handoff"

          evidence = {
              "schema_version": 1,
              "sha": sha,
              "ci": {
                  "status": aggregate,
                  "code_validated": ci_ok and handoff_ok,
                  "tests_passed": tests_ok,
              },
              "security": {
                  "status": "PASS" if security_ok else conclusion("Bot Vault Regression")
              },
              "deployment": {
                  "status": deployment_status,
                  "source": deployment_source,
              },
              "workflows": {
                  name: {
                      "status": (required.get(name) or {}).get("status", "MISSING"),
                      "conclusion": conclusion(name),
                      "run_id": (required.get(name) or {}).get("databaseId"),
                  }
                  for name in required_names
              },
          }

          Path("release-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PYEOF

      - name: Publish release evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.event.workflow_run.head_sha }}
          path: release-evidence.json
          if-no-files-found: error
