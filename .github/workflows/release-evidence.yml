name: Release Evidence Correlation

on:
  workflow_run:
    workflows:
      - Validate and hand off to Railway
    types: [completed]
    branches: [main]

concurrency:
  group: release-evidence-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  statuses: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Correlate completed workflow evidence by SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          repo = os.environ["REPO"]
          sha = os.environ["SHA"]

          required_names = [
              "SLH CI",
              "SLH Full Regression",
              "Bot Vault Regression",
              "Validate and hand off to Railway",
          ]
          terminal = {"SUCCESS", "FAILURE", "CANCELLED", "TIMED_OUT", "ERROR", "SKIPPED"}

          def gh_json(args):
              return json.loads(
                  subprocess.check_output(["gh", *args], text=True)
              )

          def latest_runs():
              runs = gh_json([
                  "run", "list",
                  "--repo", repo,
                  "--commit", sha,
                  "--limit", "100",
                  "--json", "name,status,conclusion,databaseId,headSha",
              ])
              selected = {}
              for name in required_names:
                  candidates = [
                      run for run in runs
                      if run.get("name") == name and run.get("headSha") == sha
                  ]
                  if candidates:
                      selected[name] = max(
                          candidates,
                          key=lambda item: int(item.get("databaseId") or 0),
                      )
              return selected

          def conclusion(run):
              if not run:
                  return "MISSING"
              return str(
                  run.get("conclusion") or run.get("status") or "UNKNOWN"
              ).upper()

          def railway_state():
              payload = gh_json([
                  "api",
                  f"repos/{repo}/commits/{sha}/statuses",
                  "--paginate",
              ])
              matches = [
                  item for item in payload
                  if item.get("context") == "slh-cloud-bot - slh-cloud-bot"
              ]
              if not matches:
                  return "MISSING"
              latest = max(
                  matches,
                  key=lambda item: str(item.get("created_at") or ""),
              )
              return str(latest.get("state") or "").lower() or "UNKNOWN"

          deadline = time.time() + 300
          required = {}
          while time.time() < deadline:
              required = latest_runs()
              states = {name: conclusion(required.get(name)) for name in required_names}

              required_failed = any(
                  state in {"FAILURE", "CANCELLED", "TIMED_OUT", "ERROR"}
                  for state in states.values()
              )
              required_done = all(
                  state in terminal
                  for state in states.values()
              )

              rail = railway_state()

              print(json.dumps({
                  "workflow_states": states,
                  "railway": rail,
              }, sort_keys=True))

              if required_failed:
                  break
              if required_done and rail in {"success", "failure", "error"}:
                  break
              time.sleep(5)

          required = latest_runs()
          states = {name: conclusion(required.get(name)) for name in required_names}
          rail = railway_state()

          required_failed = any(
              state in {"FAILURE", "CANCELLED", "TIMED_OUT", "ERROR"}
              for state in states.values()
          )
          required_complete = all(
              state in terminal
              for state in states.values()
          )
          tests_ok = states["SLH Full Regression"] == "SUCCESS"
          ci_ok = states["SLH CI"] == "SUCCESS"
          security_ok = states["Bot Vault Regression"] == "SUCCESS"
          handoff_ok = states["Validate and hand off to Railway"] == "SUCCESS"

          if required_failed:
              aggregate = "FAIL"
          elif required_complete and all((ci_ok, tests_ok, security_ok, handoff_ok)):
              aggregate = "PASS"
          else:
              aggregate = "PENDING"

          if rail == "success":
              deployment_status = "SUCCESS"
              deployment_source = "external_verified"
          elif rail in {"failure", "error"}:
              deployment_status = "FAIL"
              deployment_source = "external_verified"
          else:
              deployment_status = "PENDING"
              deployment_source = "github_handoff"

          evidence = {
              "schema_version": 1,
              "sha": sha,
              "ci": {
                  "status": aggregate,
                  "code_validated": ci_ok and handoff_ok,
                  "tests_passed": tests_ok,
              },
              "security": {
                  "status": "PASS" if security_ok else states["Bot Vault Regression"]
              },
              "deployment": {
                  "status": deployment_status,
                  "source": deployment_source,
              },
              "workflows": {
                  name: {
                      "status": (required.get(name) or {}).get("status", "MISSING"),
                      "conclusion": states[name],
                      "run_id": (required.get(name) or {}).get("databaseId"),
                  }
                  for name in required_names
              },
          }

          Path("release-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PYEOF

      - name: Publish release evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.event.workflow_run.head_sha }}
          path: release-evidence.json
          if-no-files-found: error
