name: SLH Full Regression

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feat/mission-real-execution-contract'
  workflow_dispatch:

concurrency:
  group: slh-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt -r slh_mcp/requirements.txt pytest
      - name: Compile Python modules
        run: python3 -m compileall -q core agents handlers services
      - name: Run full test suite
        run: python3 -m pytest -q tests