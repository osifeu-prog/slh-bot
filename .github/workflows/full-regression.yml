name: SLH Full Regression

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feat/mission-real-execution-contract'
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture CI diagnostics
        run: bash tools/ci_diagnostics.sh
      - name: Install dependencies
        run: pip install -r requirements.txt -r slh_mcp/requirements.txt pytest
      - name: Compile Python modules
        run: python3 -m compileall -q core agents handlers services
      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          python3 -m pytest -q tests 2>&1 | tee ci-diagnostics/pytest.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slh-full-regression-diagnostics
          path: |
            ci-diagnostics/**
          if-no-files-found: warn