name: Validate and hand off to Railway

on:
  push:
    branches: [main]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        run: |
          set -e
          find . -type f -name '*.py' \
            -not -path './.git/*' \
            -not -path './_slh_audit/*' \
            -not -path './_archive/*' \
            -not -path './state/*' \
            -not -path './_release_backup*/*' \
            -print0 | xargs -0 -n1 python3 -m py_compile
          echo "Python syntax: OK"

      - name: Validate mini app
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          s = Path("mini_app.html").read_text(encoding="utf-8")
          bad = ["getElementById(id));", ".trim()));", "state.wallet{}", "return);"]
          for b in bad:
              if b in s:
                  raise SystemExit(f"JS syntax error detected: {b}")
          print("Mini App validation: OK")
          PYEOF

      - name: Validate integration contracts
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from pathlib import Path
          import ast

          webapp = Path("webapp.py").read_text(encoding="utf-8")
          exchange = Path("handlers/exchange_handler.py").read_text(encoding="utf-8")
          payment = Path("handlers/payment_handler.py").read_text(encoding="utf-8")
          stars = Path("store/stars_purchase_service.py").read_text(encoding="utf-8")
          stars_authority = Path("core/stars_payment_authority.py").read_text(encoding="utf-8")
          revenue = Path("core/revenue_ledger.py").read_text(encoding="utf-8")
          dashboard = Path("core/dashboard_read_model.py").read_text(encoding="utf-8")
          read_model = Path("core/exchange_read_model.py").read_text(encoding="utf-8")
          grant = Path("store/grant_engine.py").read_text(encoding="utf-8")
          academy = Path("core/academy_manager.py").read_text(encoding="utf-8")
          ask_router = Path("core/ask_router.py").read_text(encoding="utf-8")
          tokenomics = Path("core/tokenomics.py").read_text(encoding="utf-8")
          virtual_esp = Path("core/virtual_esp.py").read_text(encoding="utf-8")
          rewards = Path("handlers/rewards_handler.py").read_text(encoding="utf-8")

          required_web_routes = [
              '@app.route("/api/v1/dashboard")',
              '@app.route("/api/v1/exchange/summary")',
              '@app.route("/api/v1/exchange/order", methods=["POST"])',
              '@app.route("/api/v1/exchange/order/<order_id>", methods=["DELETE"])',
              '@app.route("/api/v1/transfer", methods=["POST"])',
          ]
          for route in required_web_routes:
              assert route in webapp, f"missing route contract: {route}"

          for symbol in ["_place", "_match", "_assert_invariants", "_reserve", "_set_reserve"]:
              assert f"def {symbol}" in exchange, f"missing exchange helper: {symbol}"

          for symbol in ["pre_checkout", "successful_payment"]:
              assert symbol in payment, f"missing Stars handler contract: {symbol}"
          assert "purchase_item_with_stars" in payment, "missing Stars purchase import"
          assert "def purchase_item_with_stars" in stars, "missing Stars fulfillment authority"

          for symbol in [
              "get_stars_price",
              "purchase_item_with_stars",
              "_release_reservation",
              "_update_order",
          ]:
              assert f"def {symbol}" in stars, f"missing Stars service contract: {symbol}"

          assert "def record_stars_payment" in stars_authority, "missing Stars authority: record_stars_payment"

          for symbol in ["record", "summary"]:
              assert f"def {symbol}" in revenue, f"missing revenue ledger contract: {symbol}"

          for literal in [
              'currency="XTR"',
              'source="telegram_stars_item"',
              'source="telegram_stars"',
              'reference=charge_id',
              'status="RECOVERABLE"',
              'status="FULFILLED"',
          ]:
              assert literal in stars + stars_authority + payment, f"missing payment invariant: {literal}"

          for symbol in ["get_dashboard", "get_exchange_summary"]:
              source = dashboard if symbol == "get_dashboard" else read_model
              assert f"def {symbol}" in source, f"missing Truth Layer contract: {symbol}"

          # Academy fulfillment contract:
          # course grants must use the canonical Academy manager, which creates
          # academy.courses[course_id] and preserves existing progress.
          assert "if \"course\" in grant:" in grant, "missing course grant branch"
          assert "academy_manager.start_course(uid, course_id)" in grant, "course grant must call Academy start_course"
          assert "COURSE_NOT_FOUND" in grant, "course grant must reject unknown courses"
          assert "def start_course(uid, course_id):" in academy, "missing Academy start_course"
          assert '"courses": {' in academy, "Academy start_course must create course progress state"
          assert '"stage": 0' in academy and '"completed": []' in academy, "Academy initial progress contract missing"

          ast.parse(webapp)
          ast.parse(exchange)
          ast.parse(payment)
          ast.parse(stars)
          ast.parse(stars_authority)
          ast.parse(revenue)
          ast.parse(dashboard)
          ast.parse(read_model)
          ast.parse(grant)
          ast.parse(academy)
          assert "אין צורך להשלים קורס כדי לבצע Staking" in ask_router, "staking intent must state no Academy prerequisite"
          assert "לפני /stake צריך להשלים" not in ask_router, "stale staking Academy prerequisite remains"
          assert "לאחר Stage 3: /stake" not in ask_router, "stale Stage 3 staking path remains"
          assert "3 השיעורים הנדרשים ל-Staking" not in ask_router, "stale course prerequisite claim remains"
          ast.parse(ask_router)
          assert '"SLH":' in tokenomics and '"CREDITS":' in tokenomics, "tokenomics source missing canonical assets"
          assert '"supply_model": "existing_balances_only"' in tokenomics, "SLH must remain existing-balance only"
          assert '"minting_supported": False' in tokenomics, "tokenomics must not advertise minting"
          assert '@app.route("/api/v1/tokenomics")' in webapp, "missing tokenomics API route"
          assert "join_bonus_points" in webapp and "referral_bonus_points" in webapp and "lesson_complete_points" in webapp, "missing rewards read model"
          assert '"join_bonus_points": 1000' in webapp, "join reward contract drift"
          assert '"referral_bonus_points": 10' in webapp, "referral reward contract drift"
          assert '"lesson_complete_points": 25' in webapp, "lesson reward contract drift"
          assert "points=1000" in rewards and 'idempotency_key=f"welcome:{uid}"' in rewards or "points=1000" in rewards
          assert "points=10" in rewards and 'idempotency_key=f"ref:{uid}"' in rewards, "referral reward source drift"
          ast.parse(tokenomics)
          ast.parse(rewards)
          print("Tokenomics/rewards contract: OK")
          assert "dev.get(\"mqtt_topics\")" in virtual_esp, "virtual ESP must honor registered MQTT topic schema"
          assert '"slh/esp/{device_id}/progress"' in virtual_esp, "virtual ESP fallback topic contract missing"
          ast.parse(virtual_esp)
          print("ESP topic contract: OK")
          print("Staking truth contract: OK")
          print("Integration contracts: OK")
          print("Academy entitlement contract: OK")
          PYEOF

      - name: Deployment handoff
        run: |
          echo "Validation passed."
          echo "Railway is connected to main and handles the production deployment for this service."
          echo "No GitHub-side Railway secret/redeploy path is required."
