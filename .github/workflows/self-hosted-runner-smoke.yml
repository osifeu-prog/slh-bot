name: SLH Self-Hosted Runner Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner identity
        shell: bash
        run: |
          set -eu
          echo "Runner OS: $(uname -s)"
          echo "Runner arch: $(uname -m)"
          echo "Runner host: $(hostname)"
          python3 --version

      - name: Compile Asset Truth core
        if: ${{ hashFiles('core/asset_truth.py', 'core/investor_read_model.py', 'handlers/dashboard_handler.py') != '' }}
        shell: bash
        run: |
          set -eu
          test -f core/asset_truth.py
          test -f core/investor_read_model.py
          test -f handlers/dashboard_handler.py
          python3 -m py_compile core/asset_truth.py
          python3 -m py_compile core/investor_read_model.py
          python3 -m py_compile handlers/dashboard_handler.py
          echo "Asset Truth core compile: OK"

      - name: Asset Truth regression
        if: ${{ hashFiles('core/asset_truth.py', 'tests/test_asset_truth.py') != '' }}
        shell: bash
        run: |
          set -eu
          test -f core/asset_truth.py
          test -f tests/test_asset_truth.py
          python3 -m unittest tests.test_asset_truth -v
          echo "Asset Truth tests: OK"
