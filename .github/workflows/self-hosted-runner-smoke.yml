name: SLH Self-Hosted Runner Smoke

concurrency:
  group: slh-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner identity
        shell: bash
        run: |
          set -eu
          echo "Runner OS: $(uname -s)"
          echo "Runner arch: $(uname -m)"
          echo "Runner host: $(hostname)"
          python3 --version

      - name: Compile Asset Truth core
        shell: bash
        run: |
          set -eu
          if [ ! -f core/asset_truth.py ] ||              [ ! -f core/investor_read_model.py ] ||              [ ! -f handlers/dashboard_handler.py ]; then
            echo "Asset Truth core not present on this ref; skipping."
            exit 0
          fi
          python3 -m py_compile core/asset_truth.py
          python3 -m py_compile core/investor_read_model.py
          python3 -m py_compile handlers/dashboard_handler.py
          echo "Asset Truth core compile: OK"

      - name: Asset Truth regression
        shell: bash
        run: |
          set -eu
          if [ ! -f core/asset_truth.py ] || [ ! -f tests/test_asset_truth.py ]; then
            echo "Asset Truth tests not present on this ref; skipping."
            exit 0
          fi
          python3 -m unittest tests.test_asset_truth -v
          echo "Asset Truth tests: OK"
