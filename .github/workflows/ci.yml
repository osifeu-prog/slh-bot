name: SLH CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        shell: bash
        run: |
          set -e
          find . -type f -name "*.py"             -not -path "./.git/*"             -not -path "./_slh_audit/*"             -not -path "./_archive/*"             -not -path "./state/*"             -print0 | xargs -0 -n1 python -m py_compile
          echo "Python syntax: OK"

      - name: Validate JSON catalogs/config
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("store/items.json"),
          ]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8-sig"))
              print(f"JSON OK: {path}")
          PY

      - name: Verify critical store resolver
        run: |
          python - <<'PY'
          from store.engine import resolve_item_id, load_items
          items = load_items()
          assert resolve_item_id("coursebitcoin101", items) == "course_bitcoin_101"
          assert resolve_item_id("agentos", items) == "agent_os"
          print("Store alias resolver: OK")
          PY



      - name: Verify Stars purchase contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          payment = Path("handlers/payment_handler.py").read_text(encoding="utf-8")
          purchase = Path("store/stars_purchase_service.py").read_text(encoding="utf-8")
          revenue = Path("core/revenue_ledger.py").read_text(encoding="utf-8")
          stars_store = Path("handlers/stars_store.py").read_text(encoding="utf-8")
          items = __import__("json").loads(Path("store/items.json").read_text(encoding="utf-8-sig"))

          assert 'currency="XTR"' in payment
          assert "telegram_payment_charge_id" in payment
          assert "_resolve_stars_package" in payment

          assert 'order_id = "stars:" + charge_id' in purchase
          assert "get_stars_price(item_id)" in purchase
          assert "INVALID_STARS_AMOUNT" in purchase
          assert 'status": "RECOVERABLE"' in purchase
          assert 'status": "FULFILLED"' in purchase

          assert 'source="telegram_stars_item"' in purchase
          assert "reference=charge_id" in purchase
          assert "reference" in revenue
          assert "commands=['buystars']" in stars_store
          assert 'currency="XTR"' in stars_store
          assert 'invoice_payload="item_"' in stars_store
          assert any(isinstance(item, dict) and item.get("price_stars") for item in items.values())
          print("Stars payment + fulfillment + revenue contracts: OK")
          PY

      - name: Run store fulfillment tests
        run: |
          python -m unittest tests.test_stars_store_fulfillment tests.test_store_catalog_fulfillment
          echo "Store fulfillment tests: OK"

      - name: Verify rewards and academy contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          from core.tokenomics import rewards_snapshot

          rewards = rewards_snapshot()
          assert rewards["join_points"] == 1000
          assert rewards["referral_points"] == 10
          assert rewards["lesson_complete_points"] == 25
          assert rewards["course_complete_points"] == 250
          assert rewards["airdrop_slh"] == 100000

          academy = Path("core/academy_manager.py").read_text(encoding="utf-8")
          assert "course_complete:" in academy
          assert 'rewards_snapshot()["course_complete_points"]' in academy
          assert 'idempotency_key=f"{uid}:course_complete:{course_id}"' in academy

          add_points = Path("core/profile_manager.py").read_text(encoding="utf-8")
          assert "points_ledger" in add_points
          assert "idempotency_key" in add_points
          print("Rewards + Academy contract: OK")
          PY
      - name: Verify Control Plane Railway ops contract
        run: |
          python - <<'PY'
          from pathlib import Path

          deploy = Path("handlers/deploy_handler.py").read_text(encoding="utf-8")
          assert '@bot.message_handler(commands=["deploy", "redeploy"])' in deploy
          assert '@bot.message_handler(commands=["logs"])' in deploy
          assert "serviceInstanceRedeploy" in deploy
          assert "serviceInstanceDeployV2" in deploy
          assert "deploymentLogs" in deploy
          assert "buildLogs" in deploy
          print("Control Plane Railway ops contract: OK")
          PY

      - name: Verify economy mutation guard
        run: |
          python - <<'PY'
          from pathlib import Path
          policy = Path("core/exec_policy.py").read_text(encoding="utf-8")
          assert 'token_balance' in policy
          assert 'Raw wallet token balances may only be mutated by canonical application authorities.' in policy
          assert 'def is_dangerous(cmd):' in policy
          print("Direct token balance mutation guard: OK")
          PY
