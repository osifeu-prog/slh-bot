name: Mission Execution Authority

on:
  pull_request:
    paths:
      - "core/mission_*.py"
      - "agents/mission_executor.py"
      - "handlers/mission_handler.py"
      - "tests/test_mission_*.py"
      - ".github/workflows/mission-execution-authority.yml"
  push:
    branches:
      - "remediation/mission-execution-authority-20260913"

jobs:
  mission-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run mission authority tests
        run: >-
          python -m pytest -q
          tests/test_mission_action_registry.py
          tests/test_mission_execution_authority.py
          tests/test_mission_execution_persistence.py
          tests/test_mission_execution_routes.py
          tests/test_mission_lifecycle_contract.py
          tests/test_mission_lifecycle_retired.py
