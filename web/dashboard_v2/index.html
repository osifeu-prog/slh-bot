<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLH OS — Control Plane</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<header class="top">
  <div><div class="eyebrow">SLH OS</div><h1>Control Plane</h1><p>מפת מערכת אחת · בדיקות · תשתית · משתמשים · Agents · Bots · Deployments</p></div>
  <button id="refresh" class="btn">↻ רענן</button>
</header>
<section id="banner" class="banner">מתחבר למפת המערכת…</section>
<section class="stats" id="stats"></section>
<section class="card">
  <div class="section-head"><h2>🧭 מפת המערכת</h2><span id="timestamp"></span></div>
  <div id="map" class="map"></div>
</section>
<section class="card">
  <div class="section-head"><h2>🧪 בדיקת מערכת מלאה</h2><span id="summary"></span></div>
  <div id="checks" class="checks"></div>
</section>
<section class="card">
  <div class="section-head"><h2>🚀 Deploy / Git / Railway</h2></div>
  <div id="deployment" class="details"></div>
</section>
<section class="card">
  <div class="section-head"><h2>🤖 Agents & Bots</h2></div>
  <div id="runtime" class="details"></div>
</section>
<section class="card">
  <div class="section-head"><h2>🏗️ Railway inventory</h2></div>
  <div id="railway" class="table-wrap"></div>
</section>
</div>
<script src="app.js"></script>
</body>
</html>
