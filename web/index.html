<!DOCTYPE html>
<html dir="rtl" lang="he">
<head><meta charset="UTF-8"><title>SLH Empire Panel</title>
<style>body{background:#0a0a0a;color:#00ff88;font-family:monospace;padding:20px}
.card{background:#111;border:1px solid #00ff88;padding:15px;margin:10px 0;border-radius:8px}
h1{color:#00ff88}</style></head>
<body>
<h1>SLH EMPIRE PANEL</h1>
<div class="card" id="status">טוען...</div>

fetch('/api/status').then(r=>r.json()).then(d=>{
document.getElementById('status').innerHTML = 
`<b>סטטוס:</b> ${d.status}<br><b>משתמשים:</b> ${d.users}`
})
</script>
</body></html>
