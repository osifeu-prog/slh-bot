<!DOCTYPE html>
<html dir="rtl" lang="he">
<head><meta charset="UTF-8"><title>SLH COMMAND CENTER</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#000;color:#FFD700;font-family:monospace;padding:10px}
.logo{width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:5px}
.cmd{background:#111;border:1px solid #FFD700;padding:8px;border-radius:5px;font-size:12px;cursor:pointer}
.cmd:hover{background:#FFD700;color:#000}
.card{background:#111;border:1px solid #FFD700;padding:10px;margin:10px 0;border-radius:8px}
</style></head>
<body>
<img src="/assets/logo.svg" class="logo"/>
<h1>SLH COMMAND CENTER 👑</h1>
<div class="card" id="stats">טוען...</div>
<div class="card"><h3>105 פקודות</h3><div class="grid" id="commands"></div></div>

<script>
async function load(){
  let s = await fetch('/api/status'); let d = await s.json();
  document.getElementById('stats').innerHTML = `משתמשים: ${d.users} | קורסים: ${d.courses} | סטטוס: ${d.status}`;

  let a = await fetch('/api/admin?id=8789977826'); let ad = await a.json();
  let cmds = ad.commands.split(/[\n\/]/).filter(x=>x.trim());
  document.getElementById('commands').innerHTML = cmds.map(c=>`<div class="cmd">/${c}</div>`).join('');
}
load();
</script>
</body></html>
