<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" role="img" aria-labelledby="title desc">
  <title id="title">SLH OS — Smart Layer Hub</title>
  <desc id="desc">Hexagonal shield with three connected layers and a cyan central node.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111c"/><stop offset=".55" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f2fe"/><stop offset=".5" stop-color="#7f00ff"/><stop offset="1" stop-color="#00ff87"/></linearGradient>
    <filter id="glowCyan" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="520" height="150" rx="24" fill="url(#bg)"/>
  <g transform="translate(18 12)">
    <path d="M60 5 L109 33 L109 91 L60 119 L11 91 L11 33 Z" fill="none" stroke="url(#edge)" stroke-width="4" filter="url(#glowCyan)"/>
    <path d="M60 20 L60 100 M30 38 L90 82 M30 82 L90 38" fill="none" stroke="#7f00ff" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
    <path d="M26 54 H94 M26 66 H94" fill="none" stroke="#00ff87" stroke-width="2" opacity=".75"/>
    <circle cx="60" cy="60" r="11" fill="#00f2fe" filter="url(#glowCyan)"/><circle cx="60" cy="60" r="4" fill="#fff"/>
  </g>
  <g transform="translate(150 37)">
    <text x="0" y="46" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="8" fill="#fff">SLH</text>
    <text x="3" y="78" font-family="Fira Code, ui-monospace, monospace" font-size="17" font-weight="600" letter-spacing="4" fill="#00f2fe">SMART LAYER HUB</text>
  </g>
</svg>