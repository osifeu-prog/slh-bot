<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLH OS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin:0; padding:20px; font-family:Arial,sans-serif; background:#111; color:#fff; }
        h1 { margin-top:0; }
        .card { padding:16px; margin:12px 0; border-radius:14px; background:#222; }
        .value { font-size:28px; font-weight:bold; }
        .task { padding:10px 0; border-bottom:1px solid #444; }
        .done { opacity:0.55; }
        .row { padding:6px 0; }
        .muted { opacity:0.7; }
        ol { padding-left:25px; }
    </style>
</head>
<body>
    <h1>🛡 SLH OS</h1>
    <div class="card">
        <div>👤 User</div>
        <div id="name" class="value">Loading...</div>
    </div>
    <div class="card">
        <div>💰 Credits</div>
        <div id="credits" class="value">0</div>
        <div>🔒 Staked: <span id="staked">0</span></div>
        <div>🪙 Token Balance: <span id="token_balance">0</span></div>
        <div>👛 TON Wallet: <span id="ton_wallet">-</span></div>
    </div>
    <div class="card">
        <h2>🚀 Alpha</h2>
        <div id="alpha">Loading...</div>
    </div>
    <div class="card">
        <h2>📚 Academy</h2>
        <div id="academy">Loading...</div>
    </div>
    <div class="card">
        <h2>📋 Personal Tasks</h2>
        <div id="tasks">Loading...</div>
    </div>
    <div class="card">
        <h2>🏆 Points</h2>
        <div id="points" class="value">0</div>
    </div>
    <div class="card">
        <h2>📊 System Stats</h2>
        <div id="stats">Loading...</div>
    </div>
    <div class="card">
        <h2>🏆 Leaderboard</h2>
        <ol id="leaderboard"><li>Loading...</li></ol>
    </div>
    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        const initData = tg ? tg.initData : "";
        const authHeaders = initData ? { "X-Telegram-Init-Data": initData } : {};

        function renderAlpha(alpha) {
            const el = document.getElementById("alpha");
            if (!alpha || typeof alpha !== "object") {
                el.textContent = "Alpha status unavailable.";
                return;
            }

            el.innerHTML = "";

            const rows = [
                ["Status", alpha.status || "unknown"],
                ["Identity", (alpha.identity || {}).status || "unknown"],
                ["Onboarding", (alpha.onboarding || {}).status || "unknown"],
                ["Academy", (alpha.academy || {}).status || "unknown"],
                ["Tasks", (alpha.tasks || {}).status || "unknown"],
                ["Referral", (alpha.referral || {}).status || "unknown"],
                ["Share", (alpha.share || {}).status || "unknown"]
            ];

            rows.forEach(([label, value]) => {
                const row = document.createElement("div");
                row.className = "row";
                const strong = document.createElement("strong");
                strong.textContent = label + ": ";
                row.appendChild(strong);
                row.appendChild(document.createTextNode(value));
                el.appendChild(row);
            });

            const academy = alpha.academy || {};
            if (academy.courses != null) {
                const row = document.createElement("div");
                row.className = "row muted";
                row.textContent = `Academy progress: ${academy.completed_courses ?? 0}/${academy.courses ?? 0} courses, ${academy.completed_stages ?? 0} stages`;
                el.appendChild(row);
            }

            const tasks = alpha.tasks || {};
            if (tasks.total != null) {
                const row = document.createElement("div");
                row.className = "row muted";
                row.textContent = `Task progress: ${tasks.completed ?? 0}/${tasks.total ?? 0}`;
                el.appendChild(row);
            }

            const allocation = alpha.allocation || {};
            const allocationRow = document.createElement("div");
            allocationRow.className = "row muted";
            if (allocation.status === "policy_missing") {
                allocationRow.textContent = "Allocation: policy not defined — no amount is promised.";
            } else {
                allocationRow.textContent = "Allocation: " + (allocation.status || "unknown");
            }
            el.appendChild(allocationRow);
        }

        async function loadMe() {
            const nameEl = document.getElementById("name");
            if (!initData) {
                nameEl.textContent = "Open inside Telegram";
                return;
            }
            try {
                const res = await fetch("/api/v1/me", { headers: authHeaders });
                const data = await res.json();
                if (!res.ok) {
                    nameEl.textContent = res.status === 401 ? "Authentication unavailable" : "User unavailable";
                    return;
                }

                const identity = data.identity || {};
                const wallet = data.wallet || {};
                const academy = data.academy || {};
                const tasks = data.tasks || {};
                const rewards = data.rewards || {};

                nameEl.textContent = identity.display_name || "Telegram user";
                document.getElementById("credits").textContent = wallet.credits ?? 0;
                document.getElementById("staked").textContent = wallet.staked ?? 0;
                document.getElementById("token_balance").textContent = wallet.token_balance ?? 0;
                document.getElementById("ton_wallet").textContent = wallet.ton_wallet || "Not linked";
                document.getElementById("points").textContent = rewards.points ?? 0;
                renderAlpha(data.alpha);

                const academyEl = document.getElementById("academy");
                const enrolled = Array.isArray(academy.enrolled) ? academy.enrolled : [];
                academyEl.textContent = enrolled.length
                    ? "Enrolled: " + enrolled.join(", ")
                    : "No courses enrolled yet.";

                const tasksEl = document.getElementById("tasks");
                const items = Array.isArray(tasks.personal) ? tasks.personal : [];
                if (!items.length) {
                    tasksEl.textContent = "No personal tasks yet.";
                } else {
                    tasksEl.innerHTML = "";
                    items.forEach(t => {
                        const div = document.createElement("div");
                        div.className = "task" + (t.status === "done" ? " done" : "");
                        div.textContent = (t.status === "done" ? "✅ " : "⬜ ") + t.title;
                        tasksEl.appendChild(div);
                    });
                }
            } catch (e) {
                nameEl.textContent = "Unavailable";
            }
        }

        async function loadStats() {
            const statsEl = document.getElementById("stats");
            try {
                const res = await fetch("/api/stats");
                const s = await res.json();
                statsEl.innerHTML = `
                    <div>👥 Users: ${s.users}</div>
                    <div>🤖 Agents: ${s.agents}</div>
                    <div>📋 Tasks: ${s.tasks}</div>
                    <div>💰 Total Credits: ${s.credits}</div>
                `;
            } catch(e) {
                statsEl.textContent = "Unavailable";
            }
        }

        async function loadLeaderboard() {
            const lb = document.getElementById("leaderboard");
            try {
                const res = await fetch("/api/v1/leaderboard");
                const users = await res.json();
                if (!res.ok || !Array.isArray(users)) throw new Error("leaderboard unavailable");
                lb.innerHTML = "";
                users.slice(0, 10).forEach(u => {
                    const li = document.createElement("li");
                    li.textContent = (u.name || "User") + " – " + (u.points ?? 0) + " points";
                    lb.appendChild(li);
                });
            } catch (e) {
                lb.innerHTML = "<li>Unavailable</li>";
            }
        }

        loadMe();
        loadStats();
        loadLeaderboard();
    </script>
</body>
</html>
